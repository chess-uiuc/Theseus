name: CI Quick

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:

permissions:
  contents: read

jobs:
  build-test:
    name: Ubuntu/GCC
    runs-on: ubuntu-22.04
    env:
      CMAKE_BUILD_TYPE: Debug
      INSTALL_PREFIX: ${{ github.workspace }}/deps
      PYVISTA_OFF_SCREEN: "true"
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          submodules: recursive
          fetch-depth: 0
      - name: Show submodule SHAs (debug)
        run: git submodule status --recursive
      - name: Install toolchain and deps (MPI, hypre, metis)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 gfortran-12 libgl1 libegl1 \
            mpich libmpich-dev environment-modules \
            cmake ninja-build pkg-config ccache jq
          echo "CC=mpicc"   >> $GITHUB_ENV
          echo "CXX=mpicxx" >> $GITHUB_ENV
          echo "FC=mpifort" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ci-resources/requirements-ci.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-resources/requirements-ci.txt

      - name: Configure SSH for private deps
        env:
          PLATO_DEPLOY_KEY: ${{ secrets.PLATO_DEPLOY_KEY }}
          THERMO_DATABASE_DEPLOY_KEY: ${{ secrets.THERMO_DATABASE_DEPLOY_KEY }}
        run: |
          : "${PLATO_DEPLOY_KEY:?PLATO_DEPLOY_KEY is unavailable}"
          : "${THERMO_DATABASE_DEPLOY_KEY:?THERMO_DATABASE_DEPLOY_KEY is unavailable}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PLATO_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/plato_key
          printf '%s\n' "$THERMO_DATABASE_DEPLOY_KEY" | tr -d '\r' > ~/.ssh/database_key
          chmod 600 ~/.ssh/plato_key
          chmod 600 ~/.ssh/database_key
          ssh-keygen -y -f ~/.ssh/plato_key > /dev/null
          ssh-keygen -y -f ~/.ssh/database_key > /dev/null
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host github-plato
            HostName github.com
            User git
            IdentityFile ~/.ssh/plato_key
            IdentitiesOnly yes

          Host github-database
            HostName github.com
            User git
            IdentityFile ~/.ssh/database_key
            IdentitiesOnly yes
          EOF

          chmod 600 ~/.ssh/config

      - name: Fetch TPL sources and record exact versions
        env:
          PLATO_REPO: git@github-plato:chess-uiuc/plato.git
          THERMO_DATABASE_REPO: git@github-database:chess-uiuc/database.git
        run: |
          bash ./scripts/install-deps.sh prepare

      - name: Restore cached TPL install
        id: tpl-cache
        uses: actions/cache@v5
        with:
          path: tpl/install
          key: tpl-commits-1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-deps.sh', 'tpl/deps-cache-input.txt') }}

      - name: Build TPL packages when versions changed
        if: steps.tpl-cache.outputs.cache-hit != 'true'
        run: |
          bash ./scripts/install-deps.sh build

      - name: Export TPL runtime library path
        run: |
          echo "LD_LIBRARY_PATH=${{ github.workspace }}/tpl/install/lib:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Show dependency versions and installed libs
        if: always()
        run: |
          if [ -f tpl/deps-cache-input.txt ]; then
            cat tpl/deps-cache-input.txt
          fi
          if compgen -G 'tpl/logs/deps-build*.txt' > /dev/null; then
            cat tpl/logs/deps-build*.txt
          fi
          if [ -d tpl/install ]; then
            find tpl/install \( -name 'libGKlib*' -o -name 'libmetis*' -o -name 'libmfem*' \)
          fi

      - name: Full validation suite
        run: |
          python scripts/validate.py run \
            --prefix "$GITHUB_WORKSPACE/tpl/install" \
            --results "$RUNNER_TEMP/theseus-validation" --jobs 4
          python scripts/validate.py check \
            --results "$RUNNER_TEMP/theseus-validation"

      - name: Validation summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/theseus-validation/summary.txt" ]; then
            cat "$RUNNER_TEMP/theseus-validation/summary.txt"
          else
            echo "Validation summary unavailable; validation did not produce a record."
            exit 1
          fi

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theseus-validation
          path: |
            ${{ runner.temp }}/theseus-validation/manifest.json
            ${{ runner.temp }}/theseus-validation/results.json
            ${{ runner.temp }}/theseus-validation/summary.txt
            ${{ runner.temp }}/theseus-validation/logs
            ${{ runner.temp }}/theseus-validation/build-*/Testing
            ${{ runner.temp }}/theseus-validation/build-*/CMakeCache.txt
            ${{ runner.temp }}/theseus-validation/cases
